name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/erp-software-kenya/core-apis

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  apply-migrations:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run migrations on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          umask 077

          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          ssh-keyscan -H "$EC2_HOST" > "$RUNNER_TEMP/known_hosts"

          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             docker pull '$IMAGE' && \
             docker run --rm \
               --add-host=host.docker.internal:host-gateway \
               --env-file ~/Core-ERP/core-apis/.env \
               '$IMAGE' \
               node -e \"const { default: ds } = require('./dist/infrastructure/persistence/type-orm.config'); ds.initialize().then(() => ds.runMigrations()).then(m => { console.log('Migrations done:', m.length); process.exit(0); }).catch(e => { console.error(e); process.exit(1); });\""

  deploy:
    needs: apply-migrations
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          umask 077

          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          ssh-keyscan -H "$EC2_HOST" > "$RUNNER_TEMP/known_hosts"

          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             cd ~/Core-ERP/core-apis && \
             BACKEND_IMAGE='$IMAGE' docker compose -f docker-compose.development.yml pull && \
             BACKEND_IMAGE='$IMAGE' docker compose -f docker-compose.development.yml up -d && \
             docker image prune -f"
